  <!-- ====================================================================== -->
  <rect x="488" y="39" width="222" height="216" rx="6" fill="#ecfdf5" stroke="#34d399" stroke-width="1.1" />
  <rect x="488" y="39" width="222" height="19" rx="6" fill="#a7f3d0" stroke="#34d399" stroke-width="1.1" />
  <rect x="488" y="52" width="222" height="6" fill="#a7f3d0" />
  <text x="599" y="52.5" text-anchor="middle" font-size="9.5" font-weight="800" fill="#047857" letter-spacing="0.3">PILLAR III: EGEA ADAPTATION &amp; HUD</text>

  <!-- Module 7: Event Adapter & Pacing Model (y: 61 to 119) -->
  <g filter="url(#card-shadow)">
    <rect x="494" y="61" width="210" height="58" rx="5" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.1" />
    <path d="M 494 66 A 5 5 0 0 1 499 61 L 699 61 A 5 5 0 0 1 704 66 L 704 76 L 494 76 Z" fill="#d1fae5" />
    <text x="501" y="72" font-size="9.5" font-weight="700" fill="#047857">Module 7: Event Adapter &amp; Pacing</text>
    <rect x="660" y="63" width="40" height="11" rx="2.5" fill="#a7f3d0" />
    <text x="680" y="71.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#047857">EGEA</text>
    <text x="501" y="86.5" font-size="8.3" fill="#334155">• <tspan font-weight="600" fill="#0f172a">Adapter:</tspan> Monotonic k counter, 250ms debounce</text>
    <text x="501" y="97" font-size="8.3" fill="#334155">• <tspan font-weight="600" fill="#0f172a">canonicalizeStep:</tspan> Normalizes retry step keys</text>
    <text x="501" y="107.5" font-size="8.3" fill="#334155">• <tspan font-weight="600" fill="#0f172a">EWMA Pacing:</tspan> S_k = α·L_k + (1-α)S_{k-1} (α=0.3)</text>
  </g>

  <!-- Module 8: 6-Tier Scaffolding Engine (y: 123 to 181) -->
  <g filter="url(#card-shadow)">
    <rect x="494" y="123" width="210" height="58" rx="5" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.1" />
    <path d="M 494 128 A 5 5 0 0 1 499 123 L 699 123 A 5 5 0 0 1 704 128 L 704 138 L 494 138 Z" fill="#d1fae5" />
    <text x="501" y="134" font-size="9.5" font-weight="700" fill="#047857">Module 8: 6-Tier Scaffolding Engine</text>
    <rect x="656" y="125" width="44" height="11" rx="2.5" fill="#a7f3d0" />
    <text x="678" y="133.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#047857">POLICY</text>
    <text x="501" y="148.5" font-size="8.0" fill="#334155">• <tspan font-weight="600" fill="#0f172a">[1] HINT</tspan> • <tspan font-weight="600" fill="#0f172a">[2] SLOWDOWN</tspan> • <tspan font-weight="600" fill="#0f172a">[3] HIGHLIGHT</tspan></text>
    <text x="501" y="159" font-size="8.0" fill="#334155">• <tspan font-weight="600" fill="#0f172a">[4] WORKED</tspan> • <tspan font-weight="600" fill="#0f172a">[5] PREREQ</tspan> • <tspan font-weight="600" fill="#0f172a">[6] REDUCE</tspan></text>
    <text x="501" y="169.5" font-size="8.2" fill="#047857" font-weight="700">• Latency: Pure Policy 7 μs | Pipeline 14 μs</text>
  </g>

  <!-- Module 9: Spatial AR Tutor HUD (y: 185 to 245) -->
  <g filter="url(#card-shadow)">
