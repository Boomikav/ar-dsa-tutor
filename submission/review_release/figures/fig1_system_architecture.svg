<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" width="720" height="310" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0f172a" />
    </marker>
    <marker id="arrow-telemetry" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-feedback" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706" />
    </marker>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- ====================================================================== -->
  <!-- TOP HEADER BANNER (y: 6 to 34) -->
  <!-- ====================================================================== -->
  <rect x="8" y="5" width="704" height="30" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1" />
  <text x="360" y="18" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a" letter-spacing="0.3">AR-DSA TUTOR: FULL SYSTEM ARCHITECTURE &amp; DATAFLOW PIPELINE</text>
  <text x="360" y="29.5" text-anchor="middle" font-size="8.8" font-weight="500" fill="#475569">Deterministic State Reducers • Three.js WebXR Spatial Runtime • Sub-Millisecond EGEA Adaptation Loop</text>

  <!-- ====================================================================== -->
  <!-- COLUMN 1: CLIENT & SESSION LAYER (x: 10 to 232, width = 222) -->
  <!-- ====================================================================== -->
  <rect x="10" y="39" width="222" height="216" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1" />
  <rect x="10" y="39" width="222" height="19" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.1" />
  <rect x="10" y="52" width="222" height="6" fill="#e2e8f0" />
  <text x="121" y="52.5" text-anchor="middle" font-size="9.5" font-weight="800" fill="#1e293b" letter-spacing="0.3">PILLAR I: CLIENT &amp; SESSION LAYER</text>

  <!-- Module 1: Learner Viewport & UI (y: 62 to 118, h = 56) -->
  <g filter="url(#card-shadow)">
    <rect x="16" y="61" width="210" height="58" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1" />
    <path d="M 16 66 A 5 5 0 0 1 21 61 L 221 61 A 5 5 0 0 1 226 66 L 226 76 L 16 76 Z" fill="#f1f5f9" />
    <text x="23" y="72" font-size="9.5" font-weight="700" fill="#0f172a">Module 1: Learner Viewport &amp; UI</text>
    <rect x="180" y="63" width="42" height="11" rx="2.5" fill="#e2e8f0" />
    <text x="201" y="71.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#334155">CLIENT</text>
    <text x="23" y="86.5" font-size="8.3" fill="#334155">• <tspan font-weight="600" fill="#0f172a">Viewport:</tspan> Mobile WebXR canvas + spatial HUD</text>
    <text x="23" y="97" font-size="8.3" fill="#334155">• <tspan font-weight="600" fill="#0f172a">Interaction:</tspan> Screen touch &amp; raycast hit-testing</text>
    <text x="23" y="107.5" font-size="8.3" fill="#334155">• <tspan font-weight="600" fill="#0f172a">Telemetry:</tspan> Dispatches action, step key, latency</text>
  </g>

  <!-- Module 2: WebXR Session Core (y: 124 to 180, h = 56) -->
  <g filter="url(#card-shadow)">
    <rect x="16" y="123" width="210" height="58" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1" />
    <path d="M 16 128 A 5 5 0 0 1 21 123 L 221 123 A 5 5 0 0 1 226 128 L 226 138 L 16 138 Z" fill="#f1f5f9" />
    <text x="23" y="134" font-size="9.5" font-weight="700" fill="#0f172a">Module 2: WebXR Session Core</text>
    <rect x="174" y="125" width="48" height="11" rx="2.5" fill="#e2e8f0" />
    <text x="198" y="133.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#334155">SESSION</text>
    <text x="23" y="148.5" font-size="8.3" fill="#334155">• <tspan font-weight="600" fill="#0f172a">Lifecycle:</tspan> Single persistent XRSession across topics</text>
    <text x="23" y="159" font-size="8.3" fill="#334155">• <tspan font-weight="600" fill="#0f172a">Hot-Swapping:</tspan> Retains WebGL &amp; GPU resources</text>
    <text x="23" y="169.5" font-size="8.0" font-style="italic" fill="#64748b">• Boundary: Android ARCore unverified (simulation)</text>
  </g>

  <!-- Module 3: Non-WebXR Fallback Engine (y: 186 to 244, h = 58) -->
  <g filter="url(#card-shadow)">
    <rect x="16" y="185" width="210" height="60" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1" />
    <path d="M 16 190 A 5 5 0 0 1 21 185 L 221 185 A 5 5 0 0 1 226 190 L 226 200 L 16 200 Z" fill="#f1f5f9" />
    <text x="23" y="196" font-size="9.5" font-weight="700" fill="#0f172a">Module 3: Non-XR Fallback Engine</text>
    <rect x="170" y="187" width="52" height="11" rx="2.5" fill="#e2e8f0" />
    <text x="196" y="195.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#334155">FALLBACK</text>
    <text x="23" y="210.5" font-size="8.3" fill="#334155">• <tspan font-weight="600" fill="#0f172a">CANVAS_3D_FALLBACK:</tspan> OrbitControls navigation</text>
    <text x="23" y="221" font-size="8.3" fill="#334155">• <tspan font-weight="600" fill="#0f172a">Alignment:</tspan> Strict upright (+Y) spatial axis</text>
    <text x="23" y="231.5" font-size="8.3" fill="#334155">• <tspan font-weight="600" fill="#0f172a">Parity:</tspan> Executes identical algorithms &amp; EGEA rules</text>
  </g>

  <!-- ====================================================================== -->
  <!-- COLUMN 2: ALGORITHM CORE & 3D ENGINE (x: 249 to 471, width = 222) -->
  <!-- ====================================================================== -->
  <rect x="249" y="39" width="222" height="216" rx="6" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.1" />
  <rect x="249" y="39" width="222" height="19" rx="6" fill="#bae6fd" stroke="#38bdf8" stroke-width="1.1" />
  <rect x="249" y="52" width="222" height="6" fill="#bae6fd" />
  <text x="360" y="52.5" text-anchor="middle" font-size="9.5" font-weight="800" fill="#0369a1" letter-spacing="0.3">PILLAR II: ALGORITHM CORE &amp; 3D ENGINE</text>

  <!-- Module 4: Deterministic DSA Engines (y: 61 to 119) -->
  <g filter="url(#card-shadow)">
    <rect x="255" y="61" width="210" height="58" rx="5" fill="#ffffff" stroke="#bae6fd" stroke-width="1.1" />
    <path d="M 255 66 A 5 5 0 0 1 260 61 L 460 61 A 5 5 0 0 1 465 66 L 465 76 L 255 76 Z" fill="#e0f2fe" />
    <text x="262" y="72" font-size="9.5" font-weight="700" fill="#0369a1">Module 4: 5 Deterministic Engines</text>
    <rect x="424" y="63" width="37" height="11" rx="2.5" fill="#bae6fd" />
    <text x="442.5" y="71.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">STATE</text>
    <text x="262" y="86.5" font-size="8.2" fill="#334155">• <tspan font-weight="700" fill="#0f172a">BST:</tspan> Left &lt; Node &lt; Right invariant reducer</text>
    <text x="262" y="97" font-size="8.2" fill="#334155">• <tspan font-weight="700" fill="#0f172a">Bubble Sort:</tspan> Adjacent swaps • <tspan font-weight="700" fill="#0f172a">Binary:</tspan> [low, mid, high]</text>
    <text x="262" y="107.5" font-size="8.2" fill="#334155">• <tspan font-weight="700" fill="#0f172a">BFS:</tspan> FIFO queue • <tspan font-weight="700" fill="#0f172a">Stack:</tspan> LIFO (depth limit 6)</text>
  </g>

  <!-- Module 5: Procedural Three.js Visualizers (y: 123 to 181) -->
  <g filter="url(#card-shadow)">
    <rect x="255" y="123" width="210" height="58" rx="5" fill="#ffffff" stroke="#bae6fd" stroke-width="1.1" />
    <path d="M 255 128 A 5 5 0 0 1 260 123 L 460 123 A 5 5 0 0 1 465 128 L 465 138 L 255 138 Z" fill="#e0f2fe" />
    <text x="262" y="134" font-size="9.5" font-weight="700" fill="#0369a1">Module 5: Procedural 3D Visualizers</text>
    <rect x="418" y="125" width="43" height="11" rx="2.5" fill="#bae6fd" />
    <text x="439.5" y="133.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">THREE.JS</text>
    <text x="262" y="148.5" font-size="8.2" fill="#334155">• <tspan font-weight="600" fill="#0f172a">BST:</tspan> Spherical nodes &amp; directed link cylinders</text>
    <text x="262" y="159" font-size="8.2" fill="#334155">• <tspan font-weight="600" fill="#0f172a">Bubble Sort:</tspan> Scaled cylinder bars &amp; swap cues</text>
    <text x="262" y="169.5" font-size="8.2" fill="#334155">• <tspan font-weight="600" fill="#0f172a">BFS:</tspan> Graph dock • <tspan font-weight="600" fill="#0f172a">Stack:</tspan> Chamber &amp; slab meshes</text>
  </g>

  <!-- Module 6: Scene Assembler & Animations (y: 185 to 245) -->
  <g filter="url(#card-shadow)">
    <rect x="255" y="185" width="210" height="60" rx="5" fill="#ffffff" stroke="#bae6fd" stroke-width="1.1" />
    <path d="M 255 190 A 5 5 0 0 1 260 185 L 460 185 A 5 5 0 0 1 465 190 L 465 200 L 255 200 Z" fill="#e0f2fe" />
    <text x="262" y="196" font-size="9.5" font-weight="700" fill="#0369a1">Module 6: Scene Assembler &amp; Sync</text>
    <rect x="422" y="187" width="39" height="11" rx="2.5" fill="#bae6fd" />
    <text x="441.5" y="195.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#0369a1">RENDER</text>
    <text x="262" y="210.5" font-size="8.3" fill="#334155">• <tspan font-weight="600" fill="#0f172a">Scene Graph:</tspan> Pure-render state mapping</text>
    <text x="262" y="221" font-size="8.3" fill="#334155">• <tspan font-weight="600" fill="#0f172a">Transitions:</tspan> Smooth swap interpolation &amp; hits</text>
    <text x="262" y="231.5" font-size="8.3" fill="#334155">• <tspan font-weight="600" fill="#0f172a">Disposal:</tspan> Clean GPU memory on algorithm swap</text>
  </g>

