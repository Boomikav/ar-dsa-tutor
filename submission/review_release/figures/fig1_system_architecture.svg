    <path d="M 494 190 A 5 5 0 0 1 499 185 L 699 185 A 5 5 0 0 1 704 190 L 704 200 L 494 200 Z" fill="#fef3c7" />
    <text x="501" y="196" font-size="9.5" font-weight="700" fill="#b45309">Module 9: Spatial AR Tutor HUD</text>
    <rect x="664" y="187" width="36" height="11" rx="2.5" fill="#fde68a" />
    <text x="682" y="195.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b45309">HUD</text>
    <text x="501" y="210.5" font-size="8.3" fill="#334155">• <tspan font-weight="600" fill="#0f172a">ARTutorHUD:</tspan> Real-time AR viewport overlay</text>
    <text x="501" y="221" font-size="8.3" fill="#334155">• <tspan font-weight="600" fill="#0f172a">Explainability:</tspan> Grounded code &amp; conf (0.95)</text>
    <text x="501" y="231.5" font-size="8.0" font-style="italic" fill="#64748b">• Offline: 18 Challenge / 12 Stress Suites (100%)</text>
  </g>

