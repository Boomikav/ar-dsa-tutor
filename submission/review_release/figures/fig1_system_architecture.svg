  <text x="18" y="280.5" font-size="7.8" font-weight="700" fill="#0f172a"><tspan fill="#0f172a" font-weight="800">[2]</tspan> State Reducer to Visualizer</text>

  <text x="185" y="270" font-size="7.8" font-weight="700" fill="#0f172a"><tspan fill="#0f172a" font-weight="800">[3]</tspan> 3D Meshes to Scene Graph</text>
  <text x="185" y="280.5" font-size="7.8" font-weight="700" fill="#0f172a"><tspan fill="#0f172a" font-weight="800">[4]</tspan> WebGL Render Presentation</text>

