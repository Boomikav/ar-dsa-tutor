  <!-- Sub-blocks for 8 algorithms -->
  <rect x="55" y="290" width="195" height="98" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="65" y="308" font-size="10.5" font-weight="bold" fill="#0f172a">Linear &amp; Search</text>
  <text x="65" y="325" font-size="9.5" fill="#334155">&#8226; Bubble Sort: O(n&#178;) / O(1)</text>
  <text x="65" y="340" font-size="9.5" fill="#334155">&#8226; Binary Search: O(log n) / O(1)</text>
  <text x="65" y="355" font-size="9.5" fill="#334155">&#8226; Stack LIFO: O(1) / O(n)</text>
  <text x="65" y="372" font-size="9.0" fill="#059669" font-style="italic">Pairwise swap / range halving</text>

  <rect x="260" y="290" width="205" height="98" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="270" y="308" font-size="10.5" font-weight="bold" fill="#0f172a">Hierarchical Trees</text>
  <text x="270" y="325" font-size="9.5" fill="#334155">&#8226; BST Tree: O(h) / O(n)</text>
  <text x="270" y="340" font-size="9.5" fill="#334155">&#8226; AVL Tree: O(log n) / O(n)</text>
  <text x="270" y="355" font-size="9.5" fill="#334155">&#8226; Merge Sort: O(n log n) / O(n)</text>
  <text x="270" y="372" font-size="9.0" fill="#059669" font-style="italic">4-Rotations &amp; partition tree</text>

  <rect x="475" y="290" width="220" height="98" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="485" y="308" font-size="10.5" font-weight="bold" fill="#0f172a">Graph &amp; Shortest Path</text>
  <text x="485" y="325" font-size="9.5" fill="#334155">&#8226; Breadth-First Search: O(V+E)</text>
  <text x="485" y="340" font-size="9.5" fill="#334155">&#8226; Dijkstra's Algorithm: O((V+E)log V)</text>
  <text x="485" y="355" font-size="9.5" fill="#334155">&#8226; Min-Heap PQ Edge Relaxation</text>
  <text x="485" y="372" font-size="9.0" fill="#059669" font-style="italic">Non-negative weights guaranteed</text>

